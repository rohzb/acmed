services:
  acmed:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        ACMED_SOURCE_DIR: .
        ACMESH_REF: ${ACMESH_REF:-3.1.2}
    image: acmed:latest-local
    container_name: acmed
    restart: unless-stopped
    command: ["python", "-m", "acmed.main", "/app/config/config.yml"]
    environment:
      ACMED_TOKEN_ADMIN: ${ACMED_TOKEN_ADMIN:-acmed-admin-dev-token}
    volumes:
      - ../config/config.issuers.example.yml:/app/config/config.yml:ro
      - ./runtime/core-data:/app/data
    ports:
      - "8443:8443"
