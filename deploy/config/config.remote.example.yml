# Compatibility issuer config example for compose stacks.
#
# Despite the filename, this file now follows the same local issuer profile
# schema as config.issuers.example.yml. The legacy remote issuer schema with
# `mode: remote` is no longer supported by current acmed core.

server:
  host: 0.0.0.0
  port: 8443
  tls_enabled: false
  development_mode: true

identity:
  api_tokens:
    enabled: true
    tokens:
      - token_id: admin
        subject: acmed-admin
        secret_env: ACMED_TOKEN_ADMIN
        roles: [requester]
  mtls:
    enabled: false

access:
  admin_subjects: [acmed-admin]

limits:
  max_dns_names_per_order: 25
  max_csr_bytes: 32768
  max_request_body_bytes: 65536
  create_order_rate_limit_per_minute: 30

orders:
  default_ttl_seconds: 3600
  claim_ttl_seconds: 300
  max_retries: 3

acme:
  enabled: true
  directory_path: /acme/directory
  require_eab: false
  allow_wildcards: false
  supported_challenge_types: [dns-01]

storage:
  sqlite_path: /app/data/acmed.db
  artifacts_root: /app/data/orders

workers:
  poll_interval_seconds: 2
  max_parallel_orders: 4

issuers:
  - name: acmesh-dns
    type: acme_sh
    executable: /usr/local/bin/acme.sh
    ca_directory_url: https://acme-staging-v02.api.letsencrypt.org/directory
    challenge_mode: dns-01
    plugin_name: dns_cf
    force_renew: false
    credential_env: [CF_Token]

  - name: certbot-dns
    type: certbot
    executable: /usr/bin/certbot
    ca_directory_url: https://acme-staging-v02.api.letsencrypt.org/directory
    challenge_mode: dns-01
    plugin_name: dns-route53
    credential_env: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]

proof_handlers:
  - name: no-proof
    type: none

authorizers:
  - name: allow-dev-subnet
    type: source_subnet
    source_subnets: [0.0.0.0/0]

policies:
  - name: dev-any
    requester_match:
      authorizers: [allow-dev-subnet]
    allowed_domains:
      - syntax: suffix
        value: .example.org
    allowed_issuers: [acmesh-dns, certbot-dns]
    proof_handler: no-proof
    csr_mode: either
    challenge_validation_mode: trusted_bypass
